# The home page. Marked with `layout: home`, so it answers on /{lang} and needs no slug.
# Its text lives as structured blocks in the frontmatter of each index.{lang}.md — the
# composition is fixed by the design, so the fields are named rather than free markdown.

layout: home
status: published

# Cover: used for social previews (og:image). The page itself shows the photo strip below.
cover: images/hero.jpg

# Photo strip on the first screen. Each entry points at an image of a zone landing page, so the
# room photos live in one place and the zone tag on the strip comes from that page. Order is the
# order on the strip; alternate the rooms so the two-zone idea is visible before any text.
photos:
  - { page: coworking, image: images/cover.jpg }
  - { page: hackspace, image: images/cover.jpg }
  - { page: coworking, image: images/gallery-01.jpg }
  - { page: hackspace, image: images/gallery-01.jpg }
  - { page: coworking, image: images/gallery-02.jpg }
  - { page: hackspace, image: images/gallery-02.jpg }
  - { page: coworking, image: images/gallery-03.jpg }
  - { page: coworking, image: images/gallery-04.jpg }
  - { page: coworking, image: images/gallery-05.jpg }

# Cards shown in the equipment teaser, by English slug, in this order.
featuredEquipment:
  - co2-laser-cutter-100w
  - 3d-printer-anycubic-kobra-3-max-combo
  - spectrum-analyzer-rigol-rsa3030n

# Same idea for the coworking card: the three things people actually pick the room for.
# The captions come from `coworking.labels` in the localized frontmatter, not from the card titles.
featuredCoworking:
  - sit-stand-desks
  - hp-24-monitors
  - dr-coffee-machine
